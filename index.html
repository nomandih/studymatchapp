// ── Language context ───────────────────────────────────────────────────────
const LangCtx = createContext({ lang:'en', toggle:()=>{} });

function useLang() {
  const { lang, toggle } = useContext(LangCtx);
  const t = (en, zh) => lang === 'en' ? en : zh;
  return { lang, t, toggle };
}

function LangToggle({ size='md' }) {
  const { lang, toggle } = useLang();
  const padY = size==='sm' ? 3 : 5;
  const padX = size==='sm' ? 10 : 14;
  const fs   = size==='sm' ? 11 : 12;
  return (
    <button onClick={toggle} style={{
      background:'rgba(139,92,246,0.15)', border:'1px solid rgba(139,92,246,0.35)',
      borderRadius:24, padding:3, cursor:'pointer',
      display:'inline-flex', overflow:'hidden', fontFamily:'DM Sans,sans-serif',
    }}>
      {['en','zh'].map(l => (
        <span key={l} style={{
          padding:`${padY}px ${padX}px`, borderRadius:22, fontSize:fs, fontWeight:700,
          background: lang===l ? C.grad : 'transparent',
          color: lang===l ? '#fff' : 'rgba(232,232,255,0.55)',
          transition:'all .2s', letterSpacing:0.3,
        }}>{l==='en'?'EN':'中文'}</span>
      ))}
    </button>
  );
}

// ── Shared UI atoms ────────────────────────────────────────────────────────
function Tag({ label, color='purple' }) {
  const bg = color==='purple'?'rgba(139,92,246,0.2)':color==='blue'?'rgba(59,130,246,0.2)':'rgba(255,255,255,0.08)';
  const cl = color==='purple'?'#c084fc':color==='blue'?'#93c5fd':'rgba(232,232,255,0.5)';
  const br = color==='purple'?'rgba(139,92,246,0.3)':color==='blue'?'rgba(59,130,246,0.3)':'rgba(255,255,255,0.1)';
  return <span style={{ display:'inline-block', padding:'3px 10px', borderRadius:20, background:bg, color:cl, fontSize:10, fontWeight:600, border:`1px solid ${br}` }}>{label}</span>;
}

function Pill({ label, selected, onToggle }) {
  return (
    <button onClick={onToggle} style={{
      padding:'7px 14px', borderRadius:20, fontSize:12, fontWeight:500,
      border: selected ? '1px solid #8b5cf6' : '1px solid #1f1f35',
      background: selected ? 'rgba(139,92,246,0.25)' : 'rgba(255,255,255,0.04)',
      color: selected ? '#c084fc' : C.textSub, cursor:'pointer', transition:'all .15s',
      fontFamily:'DM Sans,sans-serif',
    }}>{label}</button>
  );
}

function Btn({ label, onClick, outline=false, style={} }) {
  return (
    <button onClick={onClick} style={{
      width:'100%', padding:'14px 24px', borderRadius:14, fontSize:15, fontWeight:600,
      background: outline ? 'transparent' : C.grad,
      border: outline ? `1px solid ${C.red}` : 'none',
      color: outline ? C.red : '#fff',
      cursor:'pointer', transition:'opacity .15s', letterSpacing:0.3,
      fontFamily:'DM Sans,sans-serif', ...style,
    }}
    onMouseEnter={e=>e.currentTarget.style.opacity='.85'}
    onMouseLeave={e=>e.currentTarget.style.opacity='1'}
    >{label}</button>
  );
}

function GlassCard({ children, style={} }) {
  return <div style={{ background:'rgba(139,92,246,0.08)', border:'1px solid rgba(139,92,246,0.2)', borderRadius:24, backdropFilter:'blur(12px)', boxShadow:'0 8px 32px rgba(139,92,246,0.1)', padding:18, ...style }}>{children}</div>;
}

function SectionLabel({ children }) {
  return <div style={{ fontSize:11, fontWeight:700, color:C.accentLight, letterSpacing:1, textTransform:'uppercase', display:'block', marginBottom:8 }}>{children}</div>;
}

}

// SCREEN 4 — Browse (Swipe Cards)
// ════════════════════════════════════════════════════════════════
function Screen4({ onNav, onMatch }) {
  const { t, lang } = useLang();
  const [seenIds, setSeenIds] = useState([]);
  const [drag, setDrag] = useState({ x:0, y:0, dragging:false });
  const [leaving, setLeaving] = useState(null);
  const [filterOpen, setFilterOpen] = useState(false);
  const [filterTopics, setFilterTopics] = useState({}); // { Geography: ['C5','C7'] }
  const startRef = useRef(null);

  const activeCount = Object.values(filterTopics).reduce((n, arr) => n + (arr ? arr.length : 0), 0);

  function cardMatchesFilter(card) {
    if (activeCount === 0) return true;
    if (!card.topics) return false;
    return Object.entries(filterTopics).some(([subj, codes]) => {
      if (!codes || codes.length === 0) return false;
      const ct = card.topics[subj] || [];
      return ct.some(c => codes.includes(c));
    });
  }

  const visibleDeck = CARDS.filter(card => !seenIds.includes(card.id) && cardMatchesFilter(card));

  function toggleFilterTopic(subj, code) {
    setFilterTopics(prev => {
      const list = prev[subj] || [];
      const next = list.includes(code) ? list.filter(c => c !== code) : [...list, code];
      return { ...prev, [subj]: next };
    });
  }

  function clearFilters() { setFilterTopics({}); }

  function handlePointerDown(e) {
    startRef.current = { x:e.clientX, y:e.clientY, axis:null, id:e.pointerId };
    setDrag({ x:0, y:0, dragging:true });
  }
  function handlePointerMove(e) {
    if (!drag.dragging || !startRef.current) return;
    const dx = e.clientX - startRef.current.x;
    const dy = e.clientY - startRef.current.y;
    if (!startRef.current.axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      startRef.current.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (startRef.current.axis === 'y') {
        setDrag({ x:0, y:0, dragging:false });
        startRef.current = null;
        return;
      }
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_) {}
    }
    if (startRef.current.axis === 'x') {
      e.preventDefault?.();
      setDrag({ x:dx, y:dy*0.4, dragging:true });
    }
  }
  function handlePointerUp() {
    if (!drag.dragging) { startRef.current = null; return; }
    if (drag.x > 80) swipe('right');
    else if (drag.x < -80) swipe('left');
    else setDrag({ x:0, y:0, dragging:false });
    startRef.current = null;
  }
  function swipe(dir) {
    const top = visibleDeck[0];
    if (!top) return;
    setLeaving(dir);
    setTimeout(() => {
      if (dir==='right' && top.id===1) { onMatch(); return; }
      setSeenIds(prev => [...prev, top.id]);
      setLeaving(null);
      setDrag({ x:0, y:0, dragging:false });
    }, 350);
  }

  const rot = drag.x * 0.06;
  const likeOp = Math.min(drag.x/60, 1);
  const nopeOp = Math.min(-drag.x/60, 1);

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'14px 22px 8px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div>
          <div style={{ fontSize:20, fontWeight:700, color:C.text }}>{t('Browse','配對')}</div>
          <div style={{ fontSize:12, color:C.textSub }}>{t('12 students near you','附近12位同學')}</div>
        </div>
        <button onClick={()=>setFilterOpen(true)} style={{ position:'relative', background: activeCount>0?'rgba(139,92,246,0.18)':'rgba(255,255,255,0.05)', border: activeCount>0?'1px solid rgba(139,92,246,0.4)':'1px solid #1f1f35', borderRadius:10, padding:'7px 12px', color: activeCount>0?C.accentLight:C.textSub, fontSize:12, cursor:'pointer', fontFamily:'DM Sans,sans-serif', fontWeight:600 }}>
          ⚙️ {t('Filter','篩選')}
          {activeCount>0 && (
            <span style={{ position:'absolute', top:-6, right:-6, minWidth:18, height:18, borderRadius:9, background:C.grad, color:'#fff', fontSize:10, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 5px', boxShadow:'0 2px 6px rgba(139,92,246,0.5)' }}>{activeCount}</span>
          )}
        </button>
      </div>

      <div style={{ flex:1, position:'relative', overflow:'hidden', padding:'0 22px' }}
        onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerLeave={handlePointerUp}>
        {visibleDeck.length===0 && (
          <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12, padding:'0 20px', textAlign:'center' }}>
            <div style={{ fontSize:40 }}>{activeCount>0 ? '🎯' : '🎉'}</div>
            <div style={{ fontSize:16, fontWeight:700, color:C.text }}>
              {activeCount>0 ? t('No partners match these topics','沒有匹配這些課題的夥伴') : t("You've seen everyone!",'你已看完所有人！')}
            </div>
            <div style={{ fontSize:13, color:C.textSub }}>
              {activeCount>0 ? t('Try fewer filters or check back later','嘗試減少篩選或稍後再來') : t('Check back tomorrow','明天再看看')}
            </div>
            {activeCount>0 && <button onClick={clearFilters} style={{ marginTop:8, background:'rgba(139,92,246,0.18)', border:'1px solid rgba(139,92,246,0.4)', borderRadius:10, padding:'9px 18px', color:C.accentLight, fontSize:13, fontWeight:600, cursor:'pointer', fontFamily:'DM Sans,sans-serif' }}>{t('Clear filters','清除篩選')}</button>}
          </div>
        )}

        {visibleDeck.slice(0,3).map((card, i) => {
          const isTop = i===0;
          const scale = 1 - i*0.04;
          const tx = isTop ? drag.x : 0;
          const ty = isTop ? drag.y*0.3 : i*10;
          const r  = isTop ? rot : 0;
          const lx = leaving==='right' ? 500 : leaving==='left' ? -500 : 0;
          const ly = leaving ? -80 : 0;

          return (
            <div key={card.id}
              onPointerDown={isTop ? handlePointerDown : undefined}
              style={{ position:'absolute', left:22, right:22, top:8, transform:`translate(${tx+lx}px,${ty+ly}px) rotate(${r}deg) scale(${scale})`, transition:(!drag.dragging||leaving)?'transform .35s cubic-bezier(.25,.46,.45,.94)':'none', cursor:isTop?'grab':'default', zIndex:10-i, userSelect:'none', touchAction: isTop?'pan-y':'none' }}>

              {isTop && <>
                <div style={{ position:'absolute', top:20, left:16, zIndex:20, border:'3px solid #22c55e', borderRadius:8, padding:'4px 10px', color:'#22c55e', fontSize:18, fontWeight:800, letterSpacing:2, opacity:likeOp, transform:'rotate(-15deg)' }}>{t('CONNECT','配對')}</div>
                <div style={{ position:'absolute', top:20, right:16, zIndex:20, border:'3px solid #ff4d6d', borderRadius:8, padding:'4px 10px', color:'#ff4d6d', fontSize:18, fontWeight:800, letterSpacing:2, opacity:nopeOp, transform:'rotate(15deg)' }}>{t('PASS','跳過')}</div>
              </>}

              <div style={{ background:'rgba(19,19,31,0.95)', border:'1px solid rgba(139,92,246,0.25)', borderRadius:24, padding:'18px 18px 16px', backdropFilter:'blur(12px)', boxShadow:'0 8px 32px rgba(139,92,246,0.15)', minHeight:400 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12 }}>
                  <div>
                    <div style={{ fontSize:18, fontWeight:700, color:C.text }}>{card.name}</div>
                    <div style={{ fontSize:12, color:C.textSub, marginTop:2 }}>{card.year} · {card.district}</div>
                  </div>
                  <div style={{ background:'linear-gradient(135deg,rgba(139,92,246,0.3),rgba(59,130,246,0.3))', border:'1px solid rgba(139,92,246,0.4)', borderRadius:12, padding:'5px 10px', textAlign:'center' }}>
                    <div style={{ fontSize:14, fontWeight:800, color:C.accentLight }}>{card.match}%</div>
                    <div style={{ fontSize:9, color:C.textSub }}>{t('match','配對度')}</div>
                  </div>
                </div>
                <div style={{ fontSize:13, color:C.textSub, fontStyle:'italic', marginBottom:14, lineHeight:1.5, padding:'10px 12px', background:'rgba(255,255,255,0.03)', borderRadius:12 }}>
                  {lang==='en' ? card.bio : card.bioZh}
                </div>
                <div style={{ marginBottom:10 }}>
                  <div style={{ fontSize:10, fontWeight:700, color:C.textMuted, letterSpacing:0.8, textTransform:'uppercase', marginBottom:6 }}>{t('Subjects & Topics','科目與課題')}</div>
                  <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
                    {card.subjects.map(s => {
                      const tList = (card.topics && card.topics[s]) || [];
                      const matchedSet = new Set(filterTopics[s] || []);
                      return (
                        <div key={s} style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
                          <span style={{ display:'inline-block', padding:'3px 10px', borderRadius:20, background:'rgba(139,92,246,0.2)', color:'#c084fc', fontSize:10, fontWeight:600, border:'1px solid rgba(139,92,246,0.3)' }}>{s}</span>
                          {tList.map(code => {
                            const hit = matchedSet.has(code);
                            return (
                              <span key={code} style={{
                                display:'inline-block', padding:'2px 7px', borderRadius:6,
                                background: hit ? C.grad : 'rgba(255,255,255,0.05)',
                                color: hit ? '#fff' : C.textSub,
                                fontSize:9, fontWeight:800, letterSpacing:0.4,
                                border: hit ? 'none' : '1px solid #1f1f35',
                                boxShadow: hit ? '0 2px 8px rgba(139,92,246,0.4)' : 'none',
                              }}>{code}</span>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div style={{ marginBottom:10 }}>
                  <div style={{ fontSize:10, fontWeight:700, color:C.textMuted, letterSpacing:0.8, textTransform:'uppercase', marginBottom:6 }}>{t('Study Style','學習方式')}</div>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
                    {card.styles.map(s => <Tag key={s} label={s} color="blue"/>)}
                  </div>
                </div>
                <div>
                  <div style={{ fontSize:10, fontWeight:700, color:C.textMuted, letterSpacing:0.8, textTransform:'uppercase', marginBottom:6 }}>{t('Availability','空閒時間')}</div>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
                    {card.avail.map(a => <Tag key={a} label={a} color="grey"/>)}
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ padding:'12px 22px 8px', display:'flex', justifyContent:'center', alignItems:'center', gap:24 }}>
        <button onClick={()=>swipe('left')} style={{ width:60, height:60, borderRadius:'50%', background:'rgba(255,77,109,0.1)', border:'2px solid #ff4d6d', fontSize:22, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>✕</button>
        <button onClick={()=>swipe('right')} style={{ width:70, height:70, borderRadius:'50%', background:C.grad, border:'none', fontSize:26, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 20px rgba(139,92,246,0.4)' }}>♥</button>
      </div>

      <BottomNav active="browse" onNav={onNav}/>

      {filterOpen && (
        <FilterSheet
          filterTopics={filterTopics}
          onToggle={toggleFilterTopic}
          onClear={clearFilters}
          onClose={()=>setFilterOpen(false)}
          activeCount={activeCount}
        />
      )}
    </div>
  );
}

function FilterSheet({ filterTopics, onToggle, onClear, onClose, activeCount }) {
  const { t, lang } = useLang();
  const subjectsWithTopics = SUBJECT_KEYS.filter(k => SUBJECT_TOPICS[k] && SUBJECT_TOPICS[k].length > 0);
  const [openSubj, setOpenSubj] = useState(null);

  return (
    <div style={{ position:'absolute', inset:0, zIndex:120, display:'flex', flexDirection:'column' }}>

      <div style={{
        position:'relative', background:'#0d0d18',
        borderTopLeftRadius:24, borderTopRightRadius:24,
        borderTop:'1px solid #1f1f35',
        boxShadow:'0 -10px 40px rgba(0,0,0,0.6)',
        maxHeight:'82%', display:'flex', flexDirection:'column',
        animation:'fadeIn .3s ease',
      }}>
        <div style={{ padding:'10px 22px 0', display:'flex', justifyContent:'center' }}>
          <div style={{ width:42, height:4, borderRadius:2, background:'#1f1f35' }}/>
        </div>

        <div style={{ padding:'14px 22px 8px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:'1px solid #1f1f35' }}>
          <div>
            <div style={{ fontSize:18, fontWeight:700, color:C.text }}>{t('Filter by Topic','按課題篩選')}</div>
            <div style={{ fontSize:12, color:C.textSub, marginTop:2 }}>
              {activeCount > 0

// SCREEN 5 — Create Card
// ════════════════════════════════════════════════════════════════
function Screen5({ onNav, onPost }) {
  const { t, lang } = useLang();
  const [bio, setBio] = useState('');
  const [subjects, setSubjects] = useState([0]);
  const [styles, setStyles] = useState([0]);
  const [avail, setAvail] = useState([1]);
  const [locIdx, setLocIdx] = useState(0);
  const [topics, setTopics] = useState({}); // { [subjectKey]: Set<code> }

  function toggle(arr, setArr, idx) {
    setArr(arr.includes(idx) ? arr.filter(x=>x!==idx) : [...arr, idx]);
  }

  function toggleTopic(subjKey, code) {
    setTopics(prev => {
      const next = { ...prev };
      const set = new Set(next[subjKey] || []);
      if (set.has(code)) set.delete(code); else set.add(code);
      next[subjKey] = set;
      return next;
    });
  }

  const SUBJECTS = lang==='en' ? SUBJECTS_EN : SUBJECTS_ZH;
  const STYLES   = lang==='en' ? STYLES_EN   : STYLES_ZH;
  const LOC      = lang==='en' ? LOC_EN      : LOC_ZH;

  const selectedSubjectKeys = subjects.map(i => SUBJECT_KEYS[i]);
  const subjectsWithTopics  = selectedSubjectKeys.filter(k => SUBJECT_TOPICS[k] && SUBJECT_TOPICS[k].length > 0);

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'14px 22px 10px', borderBottom:'1px solid #1f1f35' }}>
        <div style={{ fontSize:20, fontWeight:700, color:C.text }}>{t('Create Card','發佈學習卡')}</div>

          <div style={{ fontSize:15, fontWeight:700, color:C.text }}>{t('Your Name · S5','你的名字 · S5')}</div>
          <div style={{ fontSize:12, color:C.textSub, marginTop:2, fontStyle:'italic' }}>
            {bio || t('"Tell others what you\'re looking for..."','"告訴別人你在找什麼..."')}
          </div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginTop:10 }}>
            {subjects.slice(0,3).map(i => <Tag key={i} label={SUBJECTS[i]} color="purple"/>)}

        </GlassCard>

        <div>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
            <SectionLabel>{t('Bio','介紹')}</SectionLabel>

          </div>
          <textarea value={bio} onChange={e=>setBio(e.target.value.slice(0,120))}
            placeholder={t("Tell others what you're looking for...",'告訴別人你在找什麼...')}
            rows={3}
            style={{ width:'100%', padding:'11px 14px', borderRadius:12, background:'rgba(255,255,255,0.05)', border:'1px solid #1f1f35', color:C.text, fontSize:13, outline:'none', resize:'none', fontFamily:'DM Sans,sans-serif', lineHeight:1.5 }}/>
        </div>

        <div>
          <SectionLabel>{t('Subjects','科目')}</SectionLabel>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
            {SUBJECTS.map((s,i) => <Pill key={i} label={s} selected={subjects.includes(i)} onToggle={()=>toggle(subjects,setSubjects,i)}/>)}
          </div>
        </div>

        {subjectsWithTopics.map(subjKey => {
          const subjLabelEn = subjKey;
          const subjLabelZh = SUBJECTS_ZH[SUBJECT_KEYS.indexOf(subjKey)];
          const list = SUBJECT_TOPICS[subjKey];
          const sel  = topics[subjKey] || new Set();
          return (
            <div key={subjKey} style={{ background:'rgba(139,92,246,0.06)', border:'1px solid rgba(139,92,246,0.18)', borderRadius:16, padding:'14px 14px 12px' }}>

                <div>
                  <div style={{ fontSize:11, fontWeight:700, color:C.accentLight, letterSpacing:1, textTransform:'uppercase' }}>
                    {t(`${subjLabelEn} Topics`, `${subjLabelZh} 課題`)}
                  </div>
                  <div style={{ fontSize:11, color:C.textSub, marginTop:2 }}>{t('Pick the topics you need help on','選擇你需要幫助的課題')}</div>
                </div>
                {sel.size > 0 && (
                  <span style={{ fontSize:10, color:C.accentLight, fontWeight:700, background:'rgba(139,92,246,0.18)', padding:'2px 8px', borderRadius:10 }}>{sel.size}</span>
                )}
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
                {list.map(top => {
                  const isSel = sel.has(top.code);
                  return (
                    <button key={top.code} onClick={()=>toggleTopic(subjKey, top.code)} style={{
                      display:'flex', alignItems:'center', gap:10, padding:'8px 10px',
                      borderRadius:10, textAlign:'left',
                      border: isSel ? '1px solid #8b5cf6' : '1px solid #1f1f35',

                      cursor:'pointer', fontFamily:'DM Sans,sans-serif',
                    }}>
                      <span style={{
                        flexShrink:0, minWidth:28, padding:'2px 6px', borderRadius:6,
                        fontSize:10, fontWeight:800, letterSpacing:0.5, textAlign:'center',

                        color: isSel ? '#fff' : C.textSub,
                      }}>{top.code}</span>
                      <span style={{ fontSize:12, color: isSel ? C.text : C.textSub, fontWeight:isSel?600:500, flex:1 }}>
                        {lang==='en' ? top.en : top.zh}
                      </span>
                      {isSel && <span style={{ fontSize:11, color:C.accentLight }}>✓</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}

        <div>
          <SectionLabel>{t('Study Style','學習方式')}</SectionLabel>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
            {STYLES.map((s,i) => <Pill key={i} label={s} selected={styles.includes(i)} onToggle={()=>toggle(styles,setStyles,i)}/>)}
          </div>
        </div>
        <div>
          <SectionLabel>{t('Location','地點')}</SectionLabel>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
            {LOC.map((l,i) => <Pill key={i} label={l} selected={locIdx===i} onToggle={()=>setLocIdx(i)}/>)}
          </div>
        </div>
        <div style={{ paddingBottom:8 }}>
          <Btn label={t('Post Card 🚀','發佈 🚀')} onClick={onPost}/>
        </div>
      </div>

      <BottomNav active="create" onNav={onNav}/>
    </div>
  );
}

// SCREEN 7 — Chat
// ════════════════════════════════════════════════════════════════
function Screen7({ onNav, onSchedule }) {
  const { t, lang } = useLang();
  const [msgs, setMsgs] = useState([
    { from:'emily', en:"Hey! Saw you're also doing Physics DSE 👋", zh:'嗨！看到你也在學物理文憑試 👋' },
    { from:'me',    en:"Yeah! I'm focusing on mechanics right now", zh:'對！我現在專注力學部分' },
    { from:'emily', en:"Same! Want to do past papers together this week?", zh:'我也是！這週想一起做試卷嗎？' },
    { from:'me',    en:"Definitely! When are you free?", zh:'當然！你什麼時候有空？' },
    { from:'emily', en:"Thursday evening works for me 🙂", zh:'星期四晚上我有空 🙂' },
  ]);
  const [input, setInput] = useState('');
  const listRef = useRef(null);

  useEffect(() => { if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [msgs]);

  function send() {
    if (!input.trim()) return;
    setMsgs(m => [...m, { from:'me', en:input, zh:input }]);
    setInput('');
  }

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'12px 22px', borderBottom:'1px solid #1f1f35', display:'flex', alignItems:'center', gap:12 }}>
        <button onClick={()=>onNav('browse')} style={{ background:'none', border:'none', color:C.textSub, fontSize:18, cursor:'pointer' }}>←</button>
        <div style={{ width:38, height:38, borderRadius:'50%', background:C.grad, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, fontWeight:700, color:'#fff' }}>E</div>
        <div>
          <div style={{ fontSize:15, fontWeight:700, color:C.text }}>Emily Chan</div>
          <div style={{ display:'flex', alignItems:'center', gap:5 }}>
            <div style={{ width:7, height:7, borderRadius:'50%', background:C.green }}/>
            <span style={{ fontSize:11, color:C.green }}>{t('Online','在綫')}</span>
          </div>
        </div>
      </div>

      <div ref={listRef} style={{ flex:1, overflowY:'auto', padding:'14px 22px', display:'flex', flexDirection:'column', gap:10 }}>
        {msgs.map((m,i) => (
          <div key={i} style={{ display:'flex', justifyContent:m.from==='me'?'flex-end':'flex-start' }}>
            <div style={{ maxWidth:'72%', padding:'10px 14px', borderRadius:m.from==='me'?'18px 18px 4px 18px':'18px 18px 18px 4px', background:m.from==='me'?C.grad:'rgba(255,255,255,0.07)', border:m.from==='me'?'none':'1px solid #1f1f35', fontSize:13, color:'#fff', lineHeight:1.5 }}>
              {lang==='en' ? m.en : m.zh}
            </div>
          </div>
        ))}
      </div>

      <button onClick={onSchedule} style={{ margin:'0 22px 8px', padding:'11px 16px', background:'linear-gradient(135deg,rgba(139,92,246,0.2),rgba(59,130,246,0.2))', border:'1px solid rgba(139,92,246,0.3)', borderRadius:14, display:'flex', alignItems:'center', gap:10, cursor:'pointer', textAlign:'left', fontFamily:'DM Sans,sans-serif' }}>
        <span style={{ fontSize:18 }}>📅</span>
        <div>
          <div style={{ fontSize:13, fontWeight:600, color:C.accentLight }}>{t('Book a session','預約時間')}</div>
          <div style={{ fontSize:11, color:C.textSub }}>{t('Schedule your study session with Emily','預約與Emily的學習時間')}</div>
        </div>
        <span style={{ marginLeft:'auto', color:C.accentLight, fontSize:16 }}>›</span>
      </button>

      <div style={{ padding:'0 22px 10px', display:'flex', gap:10 }}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
          placeholder={t('Message...','訊息...')}
          style={{ flex:1, padding:'11px 14px', borderRadius:24, background:'rgba(255,255,255,0.06)', border:'1px solid #1f1f35', color:C.text, fontSize:14, outline:'none', fontFamily:'DM Sans,sans-serif' }}/>
        <button onClick={send} style={{ width:44, height:44, borderRadius:'50%', background:C.grad, border:'none', cursor:'pointer', fontSize:16, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>→</button>
      </div>

      <BottomNav active="chat" onNav={onNav}/>
    </div>
  );
}

function fmt(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const r = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${r}`;
}

function Screen10({ onNav, focus, setFocus }) {
  const { t } = useLang();
  const [showSettings, setShowSettings] = useState(false);

  const total = (focus.mode === 'work' ? focus.workMins : focus.breakMins) * 60;
  const progress = 1 - focus.remaining / total;
  const isWork = focus.mode === 'work';

  const ringColor = isWork ? '#8b5cf6' : '#22c55e';
  const ringGrad  = isWork ? C.grad : 'linear-gradient(135deg,#22c55e,#10b981)';

  const R = 120;
  const CIRC = 2 * Math.PI * R;
  const offset = CIRC * (1 - progress);

  function start() { setFocus(f => ({ ...f, running:true, paused:false })); }
  function pause() { setFocus(f => ({ ...f, paused:true })); }
  function resume(){ setFocus(f => ({ ...f, paused:false })); }
  function reset() {
    setFocus(f => ({ ...f, running:false, paused:false, mode:'work', remaining: f.workMins * 60 }));
  }
  function setWork(m){ setFocus(f => ({ ...f, workMins:m, remaining: f.mode==='work' && !f.running ? m*60 : f.remaining })); }
  function setBreak(m){ setFocus(f => ({ ...f, breakMins:m, remaining: f.mode==='break' && !f.running ? m*60 : f.remaining })); }

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'14px 22px 10px', borderBottom:'1px solid #1f1f35', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div>
          <div style={{ fontSize:20, fontWeight:700, color:C.text }}>{t('Focus','專注時段')}</div>
          <div style={{ fontSize:12, color:C.textSub, marginTop:2 }}>{t('Stay locked in.','保持專注。')}</div>
        </div>
        <button onClick={()=>setShowSettings(s=>!s)} style={{ background:'rgba(255,255,255,0.05)', border:'1px solid #1f1f35', borderRadius:10, padding:'7px 12px', color:C.textSub, fontSize:12, cursor:'pointer', fontFamily:'DM Sans,sans-serif' }}>⚙️ {t('Settings','設定')}</button>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'18px 22px 24px', display:'flex', flexDirection:'column', alignItems:'center', gap:20 }}>
        <div style={{ display:'flex', gap:6, padding:4, background:'rgba(255,255,255,0.04)', border:'1px solid #1f1f35', borderRadius:24 }}>
          {[
            ['work',  t('Work','專注'),  '🍅'],
            ['break', t('Break','休息'), '☕'],
          ].map(([k,label,ico]) => (
            <button key={k} onClick={()=>{
              if (focus.running) return;
              setFocus(f => ({ ...f, mode:k, remaining:(k==='work'?f.workMins:f.breakMins)*60 }));
            }} style={{
              padding:'7px 18px', borderRadius:20, border:'none',
              background: focus.mode===k ? (k==='work'?C.grad:'linear-gradient(135deg,#22c55e,#10b981)') : 'transparent',
              color: focus.mode===k ? '#fff' : C.textSub,
              fontSize:12, fontWeight:700, cursor:focus.running?'not-allowed':'pointer',
              fontFamily:'DM Sans,sans-serif', opacity:focus.running?0.6:1,
            }}>{ico} {label}</button>
          ))}
        </div>

        <div style={{ position:'relative', width:280, height:280, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <svg width="280" height="280" style={{ transform:'rotate(-90deg)' }}>
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor={isWork ? '#8b5cf6' : '#22c55e'}/>
                <stop offset="100%" stopColor={isWork ? '#3b82f6' : '#10b981'}/>
              </linearGradient>
            </defs>
            <circle cx="140" cy="140" r={R} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="14"/>
            <circle cx="140" cy="140" r={R} fill="none" stroke="url(#ringGrad)" strokeWidth="14"
              strokeLinecap="round" strokeDasharray={CIRC} strokeDashoffset={offset}
              style={{ transition:'stroke-dashoffset .5s linear', filter:`drop-shadow(0 0 10px ${ringColor}66)` }}/>
          </svg>
          <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center' }}>
            <div style={{ fontSize:11, fontWeight:700, color:isWork?C.accentLight:'#34d399', letterSpacing:2, textTransform:'uppercase', marginBottom:4 }}>
              {isWork ? t('Work','專注') : t('Break','休息')}
            </div>
            <div style={{ fontSize:54, fontWeight:300, color:C.text, fontFamily:'DM Sans,sans-serif', letterSpacing:-2, lineHeight:1 }}>{fmt(focus.remaining)}</div>
            <div style={{ fontSize:11, color:C.textMuted, marginTop:8 }}>
              {t('Sessions today','今天時段')}: <span style={{ color:C.accentLight, fontWeight:700 }}>{focus.sessions}</span>
            </div>
          </div>
        </div>

        <div style={{ display:'flex', gap:14, alignItems:'center' }}>
          <button onClick={reset} style={{ width:48, height:48, borderRadius:'50%', background:'rgba(255,255,255,0.05)', border:'1px solid #1f1f35', cursor:'pointer', fontSize:16, color:C.textSub }}>↺</button>
          {!focus.running ? (
            <button onClick={start} style={{ width:72, height:72, borderRadius:'50%', background:ringGrad, border:'none', cursor:'pointer', fontSize:24, color:'#fff', boxShadow:`0 8px 24px ${ringColor}55` }}>▶</button>
          ) : focus.paused ? (
            <button onClick={resume} style={{ width:72, height:72, borderRadius:'50%', background:ringGrad, border:'none', cursor:'pointer', fontSize:24, color:'#fff', boxShadow:`0 8px 24px ${ringColor}55` }}>▶</button>
          ) : (
            <button onClick={pause} style={{ width:72, height:72, borderRadius:'50%', background:'rgba(255,255,255,0.08)', border:'1px solid #1f1f35', cursor:'pointer', fontSize:22, color:C.text }}>⏸</button>
          )}
          <button onClick={()=>{
            const nextMode = focus.mode==='work' ? 'break' : 'work';
            const nextDur  = (nextMode==='work' ? focus.workMins : focus.breakMins) * 60;
            setFocus(f => ({ ...f, mode:nextMode, remaining:nextDur, running:false, paused:false }));
          }} style={{ width:48, height:48, borderRadius:'50%', background:'rgba(255,255,255,0.05)', border:'1px solid #1f1f35', cursor:'pointer', fontSize:16, color:C.textSub }}>⏭</button>
        </div>

        {showSettings && (
          <div style={{ width:'100%', display:'flex', flexDirection:'column', gap:14, background:'rgba(255,255,255,0.03)', border:'1px solid #1f1f35', borderRadius:16, padding:'16px' }}>
            <div>
              <div style={{ fontSize:11, fontWeight:700, color:C.accentLight, letterSpacing:1, textTransform:'uppercase', marginBottom:8 }}>{t('Work duration','專注時長')}</div>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                {[15,25,30,45,60].map(m => (
                  <button key={m} onClick={()=>setWork(m)} disabled={focus.running}
                    style={{ padding:'7px 14px', borderRadius:20, fontSize:12, fontWeight:600,
                      border: focus.workMins===m ? '1px solid #8b5cf6' : '1px solid #1f1f35',
                      background: focus.workMins===m ? 'rgba(139,92,246,0.25)' : 'rgba(255,255,255,0.04)',
                      color: focus.workMins===m ? '#c084fc' : C.textSub,
                      cursor:focus.running?'not-allowed':'pointer', fontFamily:'DM Sans,sans-serif',
                      opacity:focus.running?0.5:1,
                    }}>{m}m</button>
                ))}
              </div>
            </div>
            <div>
              <div style={{ fontSize:11, fontWeight:700, color:'#34d399', letterSpacing:1, textTransform:'uppercase', marginBottom:8 }}>{t('Break duration','休息時長')}</div>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                {[5,10,15,20].map(m => (
                  <button key={m} onClick={()=>setBreak(m)} disabled={focus.running}
                    style={{ padding:'7px 14px', borderRadius:20, fontSize:12, fontWeight:600,
                      border: focus.breakMins===m ? '1px solid #22c55e' : '1px solid #1f1f35',
                      background: focus.breakMins===m ? 'rgba(34,197,94,0.2)' : 'rgba(255,255,255,0.04)',
                      color: focus.breakMins===m ? '#34d399' : C.textSub,
                      cursor:focus.running?'not-allowed':'pointer', fontFamily:'DM Sans,sans-serif',
                      opacity:focus.running?0.5:1,
                    }}>{m}m</button>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>

      <BottomNav active="focus" onNav={onNav}/>
    </div>
  );
}

function AppInner({ lang, toggle }) {
  const [screen, setScreen] = useState('onboarding');
  const [toast, setToast] = useState({ visible:false, msg:'' });
  const [matches] = useState(CARDS.slice(0,2));
  const [focus, setFocus] = useState({
    running:false, paused:false, mode:'work',
    workMins:25, breakMins:5,
    remaining: 25 * 60, sessions: 0,
  });

  useEffect(() => {
    if (!focus.running || focus.paused) return;
    const id = setInterval(() => {
      setFocus(f => {
        if (f.remaining > 1) return { ...f, remaining: f.remaining - 1 };
        const nextMode = f.mode === 'work' ? 'break' : 'work';
        const nextDur  = (nextMode === 'work' ? f.workMins : f.breakMins) * 60;
        const nextSessions = f.mode === 'work' ? f.sessions + 1 : f.sessions;
        showToast(f.mode === 'work'
          ? (lang==='en' ? 'Work done! Take a break ☕' : '專注完成！休息一下 ☕')
          : (lang==='en' ? 'Break over — back to work 🍅' : '休息結束 — 繼續加油 🍅'));
        return { ...f, mode:nextMode, remaining:nextDur, sessions:nextSessions, running:false, paused:false };
      });
    }, 1000);
    return () => clearInterval(id);
  }, [focus.running, focus.paused, lang]);

  function showToast(msg) {
    setToast({ visible:true, msg });
    setTimeout(() => setToast({ visible:false, msg:'' }), 2500);
  }

  function handleNav(tab) {
    setScreen({ browse:'browse', create:'create', focus:'focus', chat:'chat', profile:'profile' }[tab] || screen);
  }

  function ScreenWrap({ children }) {
    return <div style={{ position:'absolute', inset:0, animation:'fadeIn .25s ease' }}>{children}</div>;
  }

  const showFloat = focus.running && screen !== 'focus' && screen !== 'onboarding' && screen !== 'setup' && screen !== 'match';

  return (
    <div style={{ position:'relative', width:'100%', height:'100%', background:C.bg, overflow:'hidden' }}>
      {screen==='onboarding' && <ScreenWrap><Screen1 onNext={()=>setScreen('setup')}/></ScreenWrap>}
      {screen==='setup'      && <ScreenWrap><Screen2 onNext={()=>setScreen('home')}/></ScreenWrap>}
      {screen==='home'       && <ScreenWrap><Screen3 onNav={handleNav} matches={matches}/></ScreenWrap>}
      {screen==='browse'     && <ScreenWrap><Screen4 onNav={handleNav} onMatch={()=>setScreen('match')}/></ScreenWrap>}
      {screen==='create'     && <ScreenWrap><Screen5 onNav={handleNav} onPost={()=>{ showToast(lang==='en'?'Card posted! 🎉':'已發佈！🎉'); setTimeout(()=>setScreen('home'),600); }}/></ScreenWrap>}
      {screen==='match'      && <ScreenWrap><Screen6 onChat={()=>setScreen('chat')} onBrowse={()=>setScreen('browse')}/></ScreenWrap>}
      {screen==='chat'       && <ScreenWrap><Screen7 onNav={handleNav} onSchedule={()=>setScreen('schedule')}/></ScreenWrap>}
      {screen==='schedule'   && <ScreenWrap><Screen8 onNav={handleNav}/></ScreenWrap>}
      {screen==='profile'    && <ScreenWrap><Screen9 onNav={handleNav} onSignOut={()=>{ showToast(lang==='en'?'Signed out 👋':'已登出 👋'); setTimeout(()=>setScreen('onboarding'),600); }}/></ScreenWrap>}
      {screen==='focus'      && <ScreenWrap><Screen10 onNav={handleNav} focus={focus} setFocus={setFocus}/></ScreenWrap>}
      {showFloat && <FocusFloat focus={focus} onOpen={()=>setScreen('focus')}/>}
      <Toast msg={toast.msg} visible={toast.visible}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PhoneShell/>);
</script>
</body>
</html>
